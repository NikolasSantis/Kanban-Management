info:
  contact: {}
  description: |-
    API de Kanban: workspaces, projetos, boards, colunas, cards, labels, comentários e anexos.
    Todas as respostas usam o envelope {success, data, error}. As listagens devolvem data = {items, pagination}.
    Para autenticar: faça login em POST /auth/login, clique em "Authorize" e informe: Bearer <token>.
  title: Kanban Management API
  version: "1.0"
paths:
  /attachment/{attachment_id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID do anexo (ObjectID)
        in: path
        name: attachment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StringEnvelope'
        "400":
          description: Parâmetro ou corpo inválido
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Sem token ou token inválido
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Só quem enviou, ou manager/admin
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Não existe ou o usuário não é membro
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Apaga um anexo (soft delete)
      tags:
      - attachments
  /attachment/{attachment_id}/download:
    get:
      description: Passa pela API, com checagem de permissão.
      parameters:
      - description: ID do anexo (ObjectID)
        in: path
        name: attachment_id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Bytes do arquivo
          schema:
            type: file
        "400":
          description: Parâmetro ou corpo inválido
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Sem token ou token inválido
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Não existe ou o usuário não é membro
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Baixa o arquivo de um anexo
      tags:
      - attachments
